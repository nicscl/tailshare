[project]
name = "tailshare"
version = "0.1.0"
description = "Drop files into your tailnet from the terminal."
requires-python = ">=3.11"
dependencies = ["textual>=8", "qrcode>=8"]

[project.scripts]
tailshare = "tailshare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tailshare"]
